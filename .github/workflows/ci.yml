name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run preflight (full)
        run: make preflight ARGS="--full"

  # CI's fresh installs resolve the newest allowed dependencies, so declared
  # FLOORS are never exercised — a typer floor too low for PEP 604 CLI
  # annotations shipped green until reviewed at the floor (PR #61 F-001).
  test-min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install at declared dependency floors
        run: |
          # click pinned to the floor era too: typer 0.12.x breaks against
          # click >= 8.2 ("Secondary flag is not valid for non-boolean flag")
          pip install typer==0.12.4 click==8.1.7 pyyaml==6.0 pydantic==2.4.0 networkx==3.0 typing-extensions==4.6.1
          pip install --no-deps -e .
      - name: CLI constructs and answers at the floors
        run: |
          agent-estimate --help
          agent-estimate --version
