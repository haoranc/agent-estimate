name: Auto-estimate

# Dogfood: label an issue `estimate` and agent-estimate posts an estimate
# comment on it. External users: replace `uses: ./` (+ checkout) with
# `uses: kiloloop/agent-estimate@v0` — see README "GitHub Action".

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  estimate:
    if: github.event.label.name == 'estimate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./
        with:
          issues: ${{ github.event.issue.number }}
          output-mode: issue-comment
          title: 'Agent Estimate — issue #${{ github.event.issue.number }}'
