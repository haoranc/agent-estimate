name: Test Action

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-action.yml'
      - 'README.md'
      - 'action.yml'
      - 'pyproject.toml'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-action.yml'
      - 'README.md'
      - 'action.yml'
      - 'pyproject.toml'
      - 'src/**'

permissions:
  contents: read
  issues: read

jobs:
  test-action-cold-source-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run action without preinstall
        id: estimate
        uses: ./
        with:
          issues: '2'
          # issue-comment enables compact rendering; its event-mismatch skip warning is expected here.
          output-mode: step-output+issue-comment
          title: |-
            Delimiter regression
            AE_EOF
      - name: Verify source, package, and invoked versions
        env:
          AE_INSTALL_SOURCE: ${{ steps.estimate.outputs.install-source }}
          AE_PACKAGE_VERSION: ${{ steps.estimate.outputs.package-version }}
          AE_REPORT: ${{ steps.estimate.outputs.report }}
        run: |
          repo_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          cli_version=$(agent-estimate --version)
          expected_cli_version="agent-estimate ${repo_version}"

          if [ "$cli_version" != "$expected_cli_version" ]; then
            echo "::error::invoked version '${cli_version}' does not match repository version '${expected_cli_version}'"
            exit 1
          fi
          if [ "$AE_PACKAGE_VERSION" != "$repo_version" ]; then
            echo "::error::package-version output '${AE_PACKAGE_VERSION}' does not match '${repo_version}'"
            exit 1
          fi
          if [ "$AE_INSTALL_SOURCE" != "action-path" ]; then
            echo "::error::install-source output is '${AE_INSTALL_SOURCE}', expected 'action-path'"
            exit 1
          fi
          if ! grep -Fq "Install provenance: \`agent-estimate ${repo_version}\` via \`action-path\`." <<< "$AE_REPORT"; then
            echo "::error::markdown report is missing source-install provenance"
            exit 1
          fi
          if ! grep -Fq "Delimiter regression AE_EOF" <<< "$AE_REPORT"; then
            echo "::error::delimiter-containing title did not survive step output"
            exit 1
          fi
          if grep -Fq "## Wave Plan" <<< "$AE_REPORT"; then
            echo "::error::single-issue comment report was not compact"
            exit 1
          fi

  test-action-version-override:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run action with explicit package version
        id: estimate
        uses: ./
        with:
          issues: '2'
          version: '0.7.4'
          output-mode: step-output
      - name: Verify explicit version override
        env:
          AE_INSTALL_SOURCE: ${{ steps.estimate.outputs.install-source }}
          AE_PACKAGE_VERSION: ${{ steps.estimate.outputs.package-version }}
        run: |
          if [ "$AE_PACKAGE_VERSION" != "0.7.4" ]; then
            echo "::error::package-version output is '${AE_PACKAGE_VERSION}', expected '0.7.4'"
            exit 1
          fi
          if [ "$AE_INSTALL_SOURCE" != "version-override" ]; then
            echo "::error::install-source output is '${AE_INSTALL_SOURCE}', expected 'version-override'"
            exit 1
          fi
          if [ "$(agent-estimate --version)" != "agent-estimate 0.7.4" ]; then
            echo "::error::explicit override did not invoke agent-estimate 0.7.4"
            exit 1
          fi

  test-action-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run action (markdown + summary; issue-comment exercises its event-mismatch skip path)
        id: estimate
        uses: ./
        with:
          issues: '2,3'
          format: markdown
          output-mode: summary+issue-comment
      - name: Verify report output
        env:
          AE_REPORT: ${{ steps.estimate.outputs.report }}
        run: |
          if [ -z "$AE_REPORT" ]; then
            echo "::error::report output is empty"
            exit 1
          fi
          echo "Report length: ${#AE_REPORT} chars"

  test-action-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run action (json + step-output)
        id: estimate
        uses: ./
        with:
          issues: '2,3'
          format: json
          output-mode: step-output
      - name: Verify JSON parses
        env:
          AE_REPORT: ${{ steps.estimate.outputs.report }}
        run: |
          echo "$AE_REPORT" | python -c "import sys,json; json.load(sys.stdin)" || {
            echo "::error::report output is not valid JSON"
            exit 1
          }
      - name: Verify expected-minutes is numeric
        env:
          AE_MINUTES: ${{ steps.estimate.outputs.expected-minutes }}
        run: |
          if [ -z "$AE_MINUTES" ]; then
            echo "::error::expected-minutes output is empty"
            exit 1
          fi
          python -c "float('$AE_MINUTES')" || {
            echo "::error::expected-minutes is not numeric: $AE_MINUTES"
            exit 1
          }
          echo "Expected minutes: $AE_MINUTES"

  test-action-invalid-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Invalid output-mode (typo)
        id: bad-typo
        continue-on-error: true
        uses: ./
        with:
          issues: '2'
          output-mode: sumary+pr-coment
      - name: Invalid output-mode (empty)
        id: bad-empty
        continue-on-error: true
        uses: ./
        with:
          issues: '2'
          output-mode: ''
      - name: Invalid output-mode (leading +)
        id: bad-leading
        continue-on-error: true
        uses: ./
        with:
          issues: '2'
          output-mode: +summary
      - name: Invalid output-mode (trailing +)
        id: bad-trailing
        continue-on-error: true
        uses: ./
        with:
          issues: '2'
          output-mode: summary+
      - name: Invalid output-mode (doubled +)
        id: bad-doubled
        continue-on-error: true
        uses: ./
        with:
          issues: '2'
          output-mode: summary++pr-comment
      - name: Verify every invalid mode failed fast
        env:
          O_TYPO: ${{ steps.bad-typo.outcome }}
          O_EMPTY: ${{ steps.bad-empty.outcome }}
          O_LEADING: ${{ steps.bad-leading.outcome }}
          O_TRAILING: ${{ steps.bad-trailing.outcome }}
          O_DOUBLED: ${{ steps.bad-doubled.outcome }}
        run: |
          rc=0
          for pair in "typo:$O_TYPO" "empty:$O_EMPTY" "leading:$O_LEADING" "trailing:$O_TRAILING" "doubled:$O_DOUBLED"; do
            if [ "${pair##*:}" != "failure" ]; then
              echo "::error::invalid output-mode case '${pair%%:*}' did not fail (outcome '${pair##*:}')"
              rc=1
            fi
          done
          exit $rc
