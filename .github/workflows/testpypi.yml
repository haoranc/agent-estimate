name: TestPyPI Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-testpypi:
    if: ${{ github.repository == 'kiloloop/agent-estimate' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build==1.5.0 twine==7.0.0
          python -m build
          python -m twine check dist/*
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-install:
    runs-on: ubuntu-latest
    needs: publish-testpypi
    permissions: {}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install from TestPyPI
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple agent-estimate
      - name: CLI smoke test
        run: |
          agent-estimate --version
          agent-estimate estimate "Smoke test from TestPyPI"
